name: Validate

on:
  # R1: the gate runs on pull requests. Pushes to main come from merged PRs, or from
  # admin-bypass docs commits that the check does not need to see twice.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# R2: only the latest push to a ref matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate
    # Public repo: GitHub runners are free, and a self-hosted runner would run fork PRs locally.
    runs-on: ubuntu-latest
    # R3: anything past 10 min is a hang.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # Pinned: the export's docstrings and signatures depend on the Python version, and the
          # catalogue records the one it was made with (python_version in the JSON).
          python-version: "3.13"
      - name: Name checker regression tests (known false positives)
        run: python scripts/tests/test_catalog_names.py
      - name: Drafting validator regression test (exception-claim rule)
        run: python scripts/tests/test_exception_claim.py
      - name: Repo checks (skills frontmatter, workflow cost rules, catalogue names)
        run: python scripts/check_repo.py
      # The catalogue must be exactly what the export script writes for its pinned version:
      # regenerate it and fail on any difference (a hand edit, or a stale export).
      - name: Catalogue is the export of its pinned polars
        run: |
          version=$(ls catalog/polars-*.json | sed -E 's|catalog/polars-(.*)\.json|\1|')
          pip install --quiet "polars==$version"
          python scripts/export_catalog.py
          # porcelain, not diff: a file the export wrote under a new name is untracked, and
          # `git diff` would not see it.
          changes=$(git status --porcelain catalog/)
          if [ -n "$changes" ]; then echo "$changes"; git diff catalog/ | head -80; exit 1; fi
